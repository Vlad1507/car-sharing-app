databaseChangeLog:
  - changeSet:
      id: create-roles-table
      author: Vlad
      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                  name: id
                  type: BIGINT
              - column:
                  constraints:
                    nullable: false
                    unique: true
                  name: role_name
                  type: VARCHAR(255)
